name: Pilzatlas CI
on:
  push:
    branches: [main, "agent-toad/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - id: lockfile
        name: Detect committed lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies from existing lockfile
        if: steps.lockfile.outputs.exists == 'true'
        run: npm ci --no-audit --no-fund
      - name: Bootstrap dependencies and lockfile
        if: steps.lockfile.outputs.exists == 'false'
        run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - name: Commit generated lockfile once
        if: github.event_name == 'push' && steps.lockfile.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock Pilzatlas npm dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
